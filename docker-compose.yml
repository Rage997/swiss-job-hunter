# Swiss Job Hunter — full stack (backend API + static frontend).
#
#   cp .env.example .env   # add at least one LLM key
#   place your CV at data/cv.txt
#   docker compose up -d --build
#
# UI:  http://localhost:5173   API: http://localhost:8765

services:
  backend:
    build: .
    image: swiss-job-hunter-backend
    env_file: .env
    ports:
      - "8765:8765"
    volumes:
      # Bind mount: drop cv.txt in from the host, keep the SQLite DB on disk.
      - ./data:/app/data
      # Named volume: cache the MiniLM embedding model across recreations.
      - hf-cache:/app/.cache/huggingface
    # Allows the container to reach Ollama running on the host (Linux requires this;
    # Mac and Windows Docker Desktop provide host.docker.internal automatically).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8765/config"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Allow time for the embedding model to download on first boot.
      start_period: 120s

  frontend:
    build:
      context: ./ui
      args:
        # Override for remote deploys; defaults to /api (nginx proxies internally).
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
    image: swiss-job-hunter-frontend
    environment:
      # Read at container startup (see ui/docker-entrypoint.sh), so this also
      # works when using the pre-built GHCR image — no rebuild required.
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  llama-cpu:
    # Optional bundled local LLM (CPU-only) for CV-vs-job scoring.
    # Only built/started when COMPOSE_PROFILES=llama is set in .env; otherwise this
    # service is never created (point LLAMA_CPP_BASE_URL at your own server instead).
    # Model auto-downloads from HF on first start into the volume.
    # Tuned via LLAMA_CPP_HF_REPO / LLAMA_CPP_CTX / LLAMA_CPP_NGL in .env.
    profiles: ["llama"]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: sjh-llama-cpu
    environment:
      - HF_HOME=/models
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-hf"
      - "${LLAMA_CPP_HF_REPO:-unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL}"
      - "--alias"
      - "${LLAMA_CPP_MODEL:-qwen3.5-9b}"
      - "-c"
      - "${LLAMA_CPP_CTX:-8192}"
      - "-ngl"
      - "${LLAMA_CPP_NGL:-0}"
      - "-np"
      - "${LLAMA_CPP_NP:-1}"
    volumes:
      - llama-cpu-models:/models
    ports:
      - "8001:8080"   # host access for debugging; backend reaches it by service name
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 300s   # ~5.5GB model download on first boot

volumes:
  hf-cache: {}
  llama-cpu-models: {}
