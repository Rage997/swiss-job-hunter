server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip static assets for faster loads.
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API calls to the backend container.
    # This works whether you access locally or remotely (Tailscale, etc.)
    location /api/ {
        proxy_pass http://backend:8765/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Long-running SSE streams (LLM scoring can take minutes). The backend also
        # sends keepalive comments every 15s; this is a safety net on top of that.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        # Stream SSE to the browser in real-time. nginx buffers proxied responses
        # by default, which would hold the keepalives/progress events until flush.
        proxy_buffering off;
    }

    # All other routes served by the SPA (no proxy).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }
}
